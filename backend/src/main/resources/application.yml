spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/payroll_lens}
    username: ${DATABASE_USER:payroll_lens}
    password: ${DATABASE_PASSWORD:payroll_lens}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health
