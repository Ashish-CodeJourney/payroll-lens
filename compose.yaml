services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payroll_lens
      POSTGRES_USER: payroll_lens
      POSTGRES_PASSWORD: payroll_lens
    ports:
      - "5433:5432"
    volumes:
      - payroll_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll_lens -d payroll_lens"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  payroll_data:
